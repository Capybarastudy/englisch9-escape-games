<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>REEF LAB – Escape from the Great Barrier Reef</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230e8a96'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ffd9a8' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{
  --deep:#03203a; --sea:#0a4a6e; --teal:#0e8a96; --aqua:#45d3cb; --coral:#ff7058; --coral-d:#e2553f;
  --sand:#ffd9a8; --paper:#f4fbfb; --ink:#0b2233; --muted:#4b6574; --ok:#1fa463; --warn:#ffb347; --bad:#ff4d4d;
  --radius:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{color:#fff;background:var(--deep);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#0c6a8f 0%,#08466b 35%,#04233a 75%,#021829 100%);overflow:hidden}
#bg .ray{position:absolute;top:-10%;width:18%;height:80%;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0));transform:skewX(-14deg);filter:blur(6px)}
.bubble{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(12px,-55vh)}100%{transform:translate(-6px,-115vh)}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none;display:none}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 40px}
h1,h2,h3{line-height:1.2;margin:.4em 0}
h1{font-size:34px;letter-spacing:.02em}
h2{font-size:27px}
h3{font-size:22px}
.hidden{display:none!important}
.btn{min-height:52px;min-width:52px;padding:10px 22px;border-radius:14px;border:0;background:var(--coral);color:#fff;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--coral-d);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec{background:rgba(255,255,255,.14);box-shadow:0 4px 0 rgba(0,0,0,.25);color:#fff}
.btn.dark{background:var(--teal);box-shadow:0 4px 0 #0a6670}
.btn.small{min-height:44px;font-size:17px;padding:6px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.glass{background:rgba(3,32,58,.62);border:1px solid rgba(255,255,255,.18);border-radius:var(--radius);padding:16px 18px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.note{font-size:17px;color:var(--muted)}
.glass .note{color:#cfe6ee}
input[type=text],textarea{background:#fff;color:var(--ink);border:2px solid #9fc3cf;border-radius:12px;padding:10px 12px;font-size:20px;min-height:50px;width:100%}
input[type=text]:focus,textarea:focus{outline:3px solid var(--aqua);border-color:var(--teal)}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:20;background:rgba(2,24,41,.92);border-bottom:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#topbar .wrap{padding:8px 16px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.o2{flex:1 1 300px;display:flex;align-items:center;gap:10px;min-width:0}
.o2 svg{flex:0 0 auto}
.o2bar{flex:1;height:22px;border-radius:11px;background:rgba(255,255,255,.15);overflow:hidden;min-width:60px}
.o2fill{height:100%;width:100%;background:linear-gradient(90deg,var(--aqua),#7ff0e3);transition:width .4s linear,background .4s}
.o2.low .o2fill{background:linear-gradient(90deg,var(--warn),#ffd58a)}
.o2.crit .o2fill{background:linear-gradient(90deg,var(--bad),#ff8a8a)}
.o2time{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px;min-width:92px;text-align:right}
.o2.crit .o2time{color:#ff8f8f}
.o2.ot .o2time{color:#ff5c5c}
.o2.ot .o2bar{background:rgba(255,77,77,.35)}
.teamlbl{font-weight:700;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hintsleft{display:flex;align-items:center;gap:4px;font-weight:700}
.inv{display:flex;gap:5px;align-items:center}
.inv .slot{width:34px;height:40px;border-radius:8px;border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--ink)}
.inv .slot.got{background:var(--sand);border:2px solid #fff}
.penalty{position:fixed;z-index:60;font-weight:900;font-size:30px;color:#ff8f8f;text-shadow:0 2px 6px #000;pointer-events:none}
#soundBtn{min-height:44px;min-width:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;display:grid;place-items:center}

/* ---------- start ---------- */
.start{padding-top:24px}
.start .hero{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media (min-width:900px){.start .hero{grid-template-columns:1.1fr .9fr}}
.start ul{padding-left:1.1em;margin:.4em 0}
.start li{margin:.3em 0}
.kicker{color:var(--sand);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:16px}
.bookbox{display:flex;gap:12px;align-items:center;background:var(--sand);color:var(--ink);padding:12px 14px;border-radius:14px;font-weight:700;margin:10px 0}

/* ---------- map ---------- */
#mapSvg{width:100%;height:auto;max-height:calc(100vh - 210px);min-height:420px;display:block;border-radius:20px}
.node{cursor:pointer}
.node .ring{fill:#5d7482;stroke:#2c3e4a;stroke-width:5}
.node .door{fill:#8aa0ac;stroke:#3a4f5c;stroke-width:4}
.node .num{fill:#24343e;font-weight:900;font-size:28px;text-anchor:middle;dominant-baseline:central}
.node .lbl{fill:#e6f4f8;font-size:20px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#03203a;stroke-width:5px;stroke-linejoin:round}
.node.locked{cursor:default}
.node.locked .lbl{fill:#8fb0bf}
.node.current .ring{fill:var(--coral);stroke:#fff}
.node.current .door{fill:#ffd2c8;stroke:#c64a37}
.node.current .glow{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.75;transform:scale(1.18)}}
.node.solved .ring{fill:var(--aqua);stroke:#fff}
.node.solved .door{fill:#03203a;stroke:#2a6b80}
.node.solved .num{fill:var(--sand);font-size:30px}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:var(--sand);stroke-width:8}
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---------- hatch view ---------- */
.hhead{display:flex;gap:14px;align-items:center;margin:16px 0 10px}
.hbadge{flex:0 0 auto;width:64px;height:64px}
.hhead h2{margin:0}
.hhead .sub{color:var(--sand);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.task{margin-bottom:14px}
.task p{margin:.35em 0}
.book{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);background:var(--sand);border-radius:10px;padding:4px 10px;font-size:17px}
.actions{margin-top:16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(2,24,41,.85);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius)}
.actions .row{justify-content:space-between}
.feedback{min-height:30px;margin:6px 0;font-weight:700;font-size:20px}
.feedback.bad{color:#ffb0b0}
.feedback.info{color:var(--sand)}
.feedback.ok{color:#9ff5c6}
.cool{display:flex;gap:10px;align-items:center;font-weight:700;color:#ffd58a}
.coolbar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;min-width:80px}
.coolbar div{height:100%;background:#ffd58a;width:100%}
.hintbox{border-left:6px solid var(--sand);background:rgba(255,217,168,.14);padding:10px 14px;border-radius:10px;margin:10px 0;font-size:19px}

/* items */
.qlist{display:grid;gap:12px}
.q{display:grid;grid-template-columns:40px 1fr;gap:6px 12px;align-items:start}
.q .n{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}
.pattern{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--teal);font-weight:800;font-size:20px}
.q .field{grid-column:2}

.lock{display:flex;gap:12px;justify-content:center;padding:16px;background:linear-gradient(#3b4d59,#22313b);border-radius:20px;border:4px solid #586c79;box-shadow:inset 0 4px 12px rgba(0,0,0,.5)}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel button{width:72px;height:52px;border-radius:12px;border:0;background:#5f7685;color:#fff;font-size:24px;touch-action:manipulation}
.wheel button:active{background:#7a93a3}
.wheel .d{width:72px;height:84px;border-radius:12px;background:linear-gradient(#e9f2f4,#fff 45%,#cfdde2);color:var(--ink);display:grid;place-items:center;font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:inset 0 3px 8px rgba(0,0,0,.3)}
.wheel .wl{font-weight:800;color:#cfe6ee;font-size:16px}
.numq{display:grid;grid-template-columns:44px 1fr 120px;gap:10px;align-items:center;margin:8px 0}
.numq .n{width:44px;height:44px;border-radius:10px;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:900}

/* boards */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:70px;padding:12px;border-radius:14px;border:2px dashed #9fc3cf;background:#e6f3f5}
.pool.over,.slot.over{outline:3px solid var(--coral);outline-offset:1px}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid #0e8a96;background:#fff;color:var(--ink);font-weight:600;font-size:18px;text-align:left;box-shadow:0 3px 0 #0a6670;line-height:1.3}
.tile.sel{background:#ffe6df;border-color:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.tile.src{opacity:.35}
.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.chain{display:grid;gap:10px;margin:12px 0}
.cslot{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}
.cslot .n{width:46px;height:46px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.slot{min-height:60px;border-radius:12px;border:2px dashed #8bb3c0;background:#eef7f8;display:flex;align-items:center;padding:4px;cursor:pointer}
.slot .tile{width:100%}
.slot:empty::after{content:attr(data-ph);color:#7b97a3;font-size:17px;padding:0 10px}
.arrowdown{color:var(--coral);font-weight:900;text-align:center;line-height:1;margin:-4px 0}
.tf{display:grid;gap:10px}
.tfrow{display:grid;grid-template-columns:36px 1fr;gap:8px 10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #cfe3e8}
.tfrow .n{font-weight:900;color:var(--teal);font-size:20px}
.tfbtns{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.tfbtns button{min-height:48px;min-width:96px;border-radius:12px;border:2px solid #9fc3cf;background:#f1f8f9;color:var(--ink);font-weight:700;font-size:18px;touch-action:manipulation}
.tfbtns button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}
.explain div{background:#e6f3f5;border-radius:10px;padding:8px 12px;font-size:17px}
.log{background:#fbf3e2;color:#3a2a14;border-radius:8px;padding:20px 22px;box-shadow:0 8px 24px rgba(0,0,0,.3);background-image:repeating-linear-gradient(180deg,transparent 0 39px,rgba(120,90,40,.18) 39px 40px);font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:2}
.log .stamp{display:inline-block;border:3px solid #b23a2b;color:#b23a2b;font:800 15px/1.2 -apple-system,Segoe UI,sans-serif;padding:4px 8px;border-radius:6px;transform:rotate(-3deg);letter-spacing:.06em;text-transform:uppercase}
.log input[type=text]{display:inline-block;width:190px;min-height:44px;padding:4px 8px;font-size:19px;font-family:-apple-system,Segoe UI,sans-serif;vertical-align:baseline;margin:2px 0}
.log .verb{font-style:italic;color:#7a5520}
.match{display:grid;gap:12px;margin:12px 0}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center}
.mrow .threat{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;min-height:60px;display:flex;align-items:center}
.ticks{display:grid;gap:8px;margin-top:8px}
.tick{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 14px;border-radius:12px;border:2px solid #9fc3cf;background:#fff;color:var(--ink);text-align:left;font-size:19px;touch-action:manipulation}
.tick .box{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:3px solid var(--teal);display:grid;place-items:center;font-weight:900;color:#fff}
.tick[aria-pressed=true]{border-color:var(--teal);background:#e1f4f3}
.tick[aria-pressed=true] .box{background:var(--teal)}
.report{position:relative;background:#fff;border-radius:6px;padding:20px 22px;line-height:2.4;font-size:20px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.3);clip-path:polygon(0 0,100% 0,100% 92%,96% 100%,90% 95%,84% 100%,76% 96%,68% 100%,60% 95%,52% 100%,44% 96%,36% 100%,28% 95%,20% 100%,12% 96%,5% 100%,0 95%)}
.report h3{font-family:Georgia,serif;margin-top:0;line-height:1.3}
.report ol{margin:0;padding-left:1.4em}
.gap{display:inline-flex;vertical-align:middle;min-width:150px;min-height:48px;margin:2px 0}
.gap .tile{padding:6px 10px;min-height:42px;font-size:18px}
.wordbank .tile{font-weight:800}
.lslots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.lslots .slot{width:70px;height:84px;justify-content:center;padding:0}
.lslots .tile,.letters .tile{width:62px;height:74px;font-size:40px;font-weight:900;text-align:center;padding:0;display:grid;place-items:center;background:var(--sand);border-color:#c98f3e;box-shadow:0 4px 0 #a8732d}
.letters{justify-content:center}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:88;background:rgba(1,14,26,.78);display:grid;place-items:center;padding:16px}
.modal{max-width:560px;width:100%}
.modal .row{justify-content:flex-end;margin-top:14px}
#openAnim{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(1,14,26,.8)}
#openAnim svg{width:min(70vw,340px);height:auto}
.flyletter{position:fixed;z-index:95;width:110px;height:130px;border-radius:18px;background:var(--sand);color:var(--ink);display:grid;place-items:center;font-size:84px;font-weight:900;box-shadow:0 0 0 6px #fff,0 10px 40px rgba(255,217,168,.7)}
.openmsg{position:fixed;left:0;right:0;bottom:16%;text-align:center;font-size:28px;font-weight:900;z-index:96;text-shadow:0 2px 8px #000;pointer-events:none}

/* ---------- certificate ---------- */
.cert{position:relative;background:#fffaf0;color:var(--ink);border-radius:20px;padding:28px 24px;text-align:center;border:10px solid var(--teal);box-shadow:0 0 0 4px var(--sand),0 12px 30px rgba(0,0,0,.4);overflow:hidden}
.cert h2{font-family:Georgia,serif;font-size:40px;color:var(--teal);margin:.2em 0}
.cert .team{font-family:Georgia,serif;font-size:34px;font-weight:700;color:var(--coral-d);border-bottom:2px solid var(--sand);display:inline-block;padding:0 18px;margin:8px 0;word-break:break-word}
.cert .stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:14px 0}
.cert .stat{background:#e6f3f5;border-radius:12px;padding:8px 16px}
.cert .stat b{display:block;font-size:28px}
.cert .ot{color:#c62828}

/* ---------- teacher ---------- */
#teacherBtn{position:fixed;left:10px;bottom:10px;z-index:70;min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:#2b1b3d;color:#fff;padding:6px 12px;font-size:16px}
#teacherPanel{position:fixed;inset:0;z-index:85;background:rgba(1,10,20,.9);overflow:auto;padding:16px}
#teacherPanel .card{max-width:980px;margin:0 auto}
table.sol{width:100%;border-collapse:collapse;font-size:17px}
table.sol th,table.sol td{border-bottom:1px solid #cfe3e8;padding:8px;text-align:left;vertical-align:top}
table.sol th{background:#e6f3f5}
table.sol tr.cur td{background:#fff1ec}
.big{font-size:24px}

@media (max-width:820px){
  h1{font-size:30px}
  .mrow{grid-template-columns:1fr}
  .numq{grid-template-columns:44px 1fr 100px}
  .wheel .d{width:64px;height:76px;font-size:46px}
  .wheel button{width:64px}
}
@media print{#topbar,.actions,#teacherBtn,#bg{display:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header id="topbar" class="hidden">
  <div class="wrap">
    <div class="o2" id="o2" role="timer" aria-label="Oxygen left">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="9" y="6" width="16" height="25" rx="7" fill="#45d3cb" stroke="#fff" stroke-width="2"/><rect x="13" y="1" width="8" height="6" rx="2" fill="#fff"/><text x="17" y="22" text-anchor="middle" font-size="10" font-weight="900" fill="#03203a">O₂</text></svg>
      <div class="o2bar"><div class="o2fill" id="o2fill"></div></div>
      <div class="o2time" id="o2time">40:00</div>
    </div>
    <div class="teamlbl" id="teamLbl"></div>
    <div class="hintsleft" id="hintsLeft" aria-label="Hints left"></div>
    <div class="inv" id="inv" aria-label="Collected letters"></div>
    <button id="soundBtn" type="button" aria-label="Sound off" title="Sound"></button>
  </div>
</header>

<main id="app"></main>

<script>
(function(){
'use strict';

      if (from !== 'pool'){ if (existing) placement[from] = existing; else delete placement[from]; }
    }
    selected = null;
    render(); beep('tap');
    opt.onChange && opt.onChange(placement);
  }
  function tileFor(item){
    var t = el('button', {type:'button', class:'tile ' + (opt.tileClass || '') + (selected === item.id ? ' sel' : ''), 'data-item':item.id,
      'aria-pressed': selected === item.id ? 'true' : 'false', text:item.label});
    t.addEventListener('click', function(ev){
      ev.stopPropagation();
      if (now() - lastDragEnd < 400) return;
      var loc = where(item.id);
      if (selected && selected !== item.id && loc !== 'pool'){ move(selected, loc); return; }
      selected = selected === item.id ? null : item.id;
      render();
    });
    t.addEventListener('pointerdown', function(ev){ startDrag(ev, item, t); });
    return t;
  }
  function render(){
    opt.pool.innerHTML = '';
    for (var s in opt.slots) opt.slots[s].innerHTML = '';
    opt.items.forEach(function(item){
      var loc = where(item.id);
      (loc === 'pool' ? opt.pool : opt.slots[loc]).appendChild(tileFor(item));
    });
  }
  function targetAt(x, y){
    var list = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [document.elementFromPoint(x, y)];
    for (var k = 0; k < list.length; k++){
      var e = list[k];
      if (e && e.closest && e.closest('#topbar')) return null;
      while (e && e !== document.body){
        if (e === opt.pool) return 'pool';
        for (var s in opt.slots) if (opt.slots[s] === e) return s;
        e = e.parentNode;
      }
    }
    return null;
  }
  function targetEl(t){ return t === 'pool' ? opt.pool : t ? opt.slots[t] : null; }
  function startDrag(ev, item, t){
    if (ev.button > 0) return;
    lastDragEnd = 0;
    var sx = ev.clientX, sy = ev.clientY, ghost = null, over = null, pid = ev.pointerId, ox = 0, oy = 0, py = sy, raf = 0;
    function autoScroll(){
      // scroll the page while a card is held near the top or bottom edge
      var vh = window.innerHeight, sp = 0;
      if (py > vh - 110) sp = Math.min(18, (py - (vh - 110)) / 4);
      else if (py < 150) sp = -Math.min(18, (150 - py) / 4);
      if (sp) window.scrollBy(0, sp);
      raf = requestAnimationFrame(autoScroll);
    }
    try { t.setPointerCapture(pid); } catch (e) {}
    function mv(e){
      if (e.pointerId !== pid) return;
      if (!ghost){
        if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 10) return;
        var r = t.getBoundingClientRect();
        ox = sx - r.left; oy = sy - r.top;
        ghost = t.cloneNode(true); ghost.classList.add('ghost');
        ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
        document.body.appendChild(ghost); t.classList.add('src');
        raf = requestAnimationFrame(autoScroll);
      }
      py = e.clientY;
      e.preventDefault();
      ghost.style.left = (e.clientX - ox) + 'px'; ghost.style.top = (e.clientY - oy) + 'px';
      var tg = targetEl(targetAt(e.clientX, e.clientY));
      if (tg !== over){ over && over.classList.remove('over'); over = tg; over && over.classList.add('over'); }
    }
    function up(e){
      if (e.pointerId !== pid) return;
      t.removeEventListener('pointermove', mv); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
      over && over.classList.remove('over');
      if (raf) cancelAnimationFrame(raf);
      if (ghost){
        ghost.remove(); t.classList.remove('src'); lastDragEnd = now();
        var tgt = e.type === 'pointerup' ? targetAt(e.clientX, e.clientY) : null;
        if (tgt) move(item.id, tgt);
      }
    }
    t.addEventListener('pointermove', mv); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
  }
  function tapTarget(target){
    if (!selected) return;
    move(selected, target);
  }
  opt.pool.addEventListener('click', function(){ tapTarget('pool'); });
  Object.keys(opt.slots).forEach(function(s){
    var se = opt.slots[s];
    se.setAttribute('role', 'button'); se.setAttribute('tabindex', '0');
    se.addEventListener('click', function(){ tapTarget(s); });
    se.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tapTarget(s); } });
  });
  self.placement = placement;
  self.render = render;
  render();
}

function doCheck(){

    S.penalty += PEN; S.lockUntil = now() + LOCKS * 1000; save();

    d.style.left = (Math.random() * 100) + '%'; d.style.width = d.style.height = s + 'px';
    d.style.animationDuration = (14 + Math.random() * 16) + 's'; d.style.animationDelay = (-Math.random() * 25) + 's';
    b.appendChild(d);
  }
})();

/* ===================== INIT ===================== */
renderSound();
setupTeacher();
if (!S.started) renderStart();
else if (S.finished || S.view === 'end') renderEnd();
else if (typeof S.view === 'number' && S.view <= S.progress && S.view < 8) openHatch(S.view);
else renderMap();
setInterval(tick, 250);

})();
</script>
