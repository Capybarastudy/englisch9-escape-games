<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Englisch 9 – Escape Games</title>
<style>
:root{--deep:#03203a;--teal:#0e8a96;--aqua:#45d3cb;--coral:#ff7058;--sand:#ffd9a8;--paper:#f4fbfb;--ink:#0b2233}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0c6a8f,#03203a 70%);color:#fff;font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:32px 16px}
h1{font-size:34px;margin:0 0 6px}
p.sub{margin:0 0 24px;color:#cfe6ee}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
a.game{display:block;background:var(--paper);color:var(--ink);text-decoration:none;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3);min-height:44px}
a.game:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
a.game svg{display:block;width:100%;height:auto}
a.game div{padding:14px 16px}
a.game b{display:block;font-size:21px}
a.game span{color:#4b6574;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Englisch 9 – Escape Games</h1>
  <p class="sub">Red Line Bayern 5 · Klasse 9 · für iPads im Team (Schülerbuch offen daneben)</p>
  <div class="grid">
    <a class="game" href="games/great-barrier-reef/index.html">
      <svg viewBox="0 0 320 140" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2aa6c4"/><stop offset="1" stop-color="#05304d"/></linearGradient></defs>
        <rect width="320" height="140" fill="url(#g)"/>
        <path d="M0 118 C60 108 120 128 190 116 C250 106 290 122 320 114 V140 H0Z" fill="#d8b98a"/>
        <g stroke="#ff7058" stroke-width="6" stroke-linecap="round" fill="none"><path d="M40 126 V96 M40 108 L28 92 M40 100 L50 84"/></g>
        <rect x="110" y="56" width="110" height="50" rx="25" fill="#c9d8de" stroke="#4d6573" stroke-width="4"/>
        <circle cx="140" cy="81" r="9" fill="#45d3cb"/><circle cx="165" cy="81" r="9" fill="#45d3cb"/><circle cx="190" cy="81" r="9" fill="#45d3cb"/>
        <path d="M250 40 C258 30 272 30 280 40 C272 50 258 50 250 40Z M252 40 L242 32 L244 40 L242 48Z" fill="#ffd166"/>
      </svg>
      <div><b>REEF LAB – Great Barrier Reef in danger</b><span>Unit 1, Text 2 · SB pp. 23–24 · 40 Minuten</span></div>
    </a>
  </div>
</div>
</body>
</html>
